name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
    - name: Install build dependencies.
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-m68k-linux-gnu qemu-user xxd python3-pil
    - name: Check out repository.
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Get the tag name.
      id: get_tag
      run: echo TAG=$(git describe --tags | tail -c +2) >> $GITHUB_OUTPUT
    - name: Run m68k relocation tests.
      run: make -C tests/qemu check
    - name: Build library and applets.
      run: |
        echo "$PREFIX/bin" >> $GITHUB_PATH
        make
    - name: Upload applets artifact.
      uses: actions/upload-artifact@v6
      with:
        name: betawise-applets-${{ steps.get_tag.outputs.TAG }}
        path: "applets/**/*.OS3KApp"
