name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
    - name: Install build dependencies.
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-m68k-linux-gnu qemu-user xxd python3-pil
    - name: Check out repository.
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Initialize pinned submodules.
      run: git submodule update --init applets/MicroPython/upstream applets/UCBLogo/upstream
    - name: Get the tag name.
      id: get_tag
      run: echo TAG=$(git describe --tags | tail -c +2) >> $GITHUB_OUTPUT
    - name: Run m68k relocation tests.
      run: make -C tests/qemu check
    - name: Build library and applets.
      run: |
        echo "$PREFIX/bin" >> $GITHUB_PATH
        make
        os3k/compiler-rt/check.sh
    - name: Collect published applets.
      id: applets
      shell: bash
      run: |
        applet_list=$(make --no-print-directory -s -C applets published-applets)
        applets=()
        if [[ -n "$applet_list" ]]; then
          mapfile -t applets <<< "$applet_list"
        fi
        if (( ${#applets[@]} == 0 )); then
          echo "No published applets found" >&2
          exit 1
        fi
        artifact_dir=$(mktemp -d "$RUNNER_TEMP/betawise-applets.XXXXXX")
        for applet in "${applets[@]}"; do
          if [[ -e "$artifact_dir/${applet##*/}" ]]; then
            echo "Duplicate applet filename: ${applet##*/}" >&2
            exit 1
          fi
          cp -- "$applet" "$artifact_dir/"
        done
        echo "path=$artifact_dir" >> "$GITHUB_OUTPUT"
    - name: Upload applets artifact.
      uses: actions/upload-artifact@v6
      with:
        name: betawise-applets-${{ steps.get_tag.outputs.TAG }}
        path: ${{ steps.applets.outputs.path }}
        if-no-files-found: error
